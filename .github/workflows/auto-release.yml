name: Release (Arduino Library)

on:
  pull_request:
    types:
      - closed
    branches:
      - release
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read & compare versions
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          if [[ ! -f library.json ]]; then
            echo "❌ library.json not found"; exit 1
          fi
          if [[ ! -f library.properties ]]; then
            echo "❌ library.properties not found"; exit 1
          fi

          V_JSON="$(jq -r '.version // empty' library.json | tr -d '[:space:]')"
          V_PROP="$(grep -E '^[[:space:]]*version[[:space:]]*=' -m1 library.properties | cut -d= -f2- | tr -d '[:space:]')"

          if [[ -z "${V_JSON}" ]]; then
            echo "❌ Could not read .version from library.json"; exit 1
          fi
          if [[ -z "${V_PROP}" ]]; then
            echo "❌ Could not read version=... from library.properties"; exit 1
          fi

          echo "library.json version:      ${V_JSON}"
          echo "library.properties version:${V_PROP}"

          if [[ "${V_JSON}" != "${V_PROP}" ]]; then
            echo "❌ Version mismatch!"; exit 1
          fi

          # Optional: Tag-Format (z.B. "v1.2.3" oder "1.2.3")
          TAG="v${V_JSON}"

          echo "version=${V_JSON}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "❌ Tag ${TAG} exists already. Bump version first."; exit 1
          fi

      - name: Create zip of repo root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="HomeAssistantManager-${{ steps.ver.outputs.tag }}.zip"
          # zip vom gesamten Repo-Root, ohne .git
          zip -r "${ZIP_NAME}" . -x ".git/*" -x ".github/workflows/*" -x ".github/*" -x ".github"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
